<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a2b"><meta name="description" content="Caos Total: arena multiplayer para até cinco jogadores."><title>Caos Total — Party Arena</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="lobby" class="panel"><div class="eyebrow">⚡ PARTY ARENA • 2–5 JOGADORES</div><h1>CAOS <span>TOTAL</span></h1><p class="subtitle">Entre na arena. Sobreviva ao caos.</p><label for="name">SEU NOME</label><input id="name" maxlength="16" placeholder="Seu apelido" value="Jogador"><button id="create" class="primary">CRIAR SALA</button><div class="join-row"><input id="roomCode" maxlength="4" placeholder="CÓDIGO DA SALA" aria-label="Código da sala"><button id="join">ENTRAR</button></div><p id="status" role="status" aria-live="polite"></p><section id="roomInfo" hidden><div class="room-heading">SALA <strong id="codeLabel"></strong><button id="copyCode" class="copy">COPIAR</button></div><ul id="players"></ul><p id="waiting">Aguardando jogadores...</p><button id="start" class="primary">COMEÇAR PARTIDA</button><small>É necessário ter pelo menos 2 jogadores.</small></section><div class="lobby-decoration"><span></span><span></span><span></span></div></main>
<main id="game" hidden><header><strong>CAOS <span>TOTAL</span></strong><span id="gameCode"></span><button id="leave" class="small-btn">SAIR</button></header><section class="hud"><div><small>RODADA</small><b id="round">01</b></div><div><small>TEMPO</small><b id="timer">02:00</b></div><div><small>STATUS</small><b id="phase">BATALHA</b></div><div class="health"><small>ENERGIA</small><div class="health-track"><i id="healthFill"></i></div></div></section><div class="arena-frame"><canvas id="arena" width="900" height="600" aria-label="Arena de batalha vista de cima"></canvas></div><div class="game-bottom"><div class="mobile-controls"><div class="control-label">MOVIMENTO<div id="joystick"><div id="stick"></div></div></div><div class="action-controls"><button id="boost">IMPULSO <b>⚡</b><small>3,5s</small></button><button id="shoot">DISPARAR <b>✦</b><small>Atacar</small></button></div></div><aside class="scoreboard"><strong>PLACAR</strong><ol id="scores"></ol></aside></div><div id="feed" aria-live="polite"></div><section id="results" hidden><div class="result-card"><div class="eyebrow">FIM DA RODADA</div><h2 id="winner">VITÓRIA!</h2><p id="resultText"></p><button id="again" class="primary">JOGAR NOVAMENTE</button><button id="backLobby" class="secondary">VOLTAR AO LOBBY</button></div></section></main><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="./game.js"></script></body></html>
