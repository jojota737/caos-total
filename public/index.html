<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a2b"><meta name="description" content="Caos Total: arena multiplayer para até cinco jogadores."><title>Caos Total — Party Arena</title><style>
*{box-sizing:border-box}:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101a2b;color:#f4f7ff}body{margin:0;min-height:100vh;background:#101a2b;color:#f4f7ff;display:grid;place-items:center;padding:16px;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 5%,#274a7080,transparent 55%),radial-gradient(circle at 12% 80%,#563d7540,transparent 30%)}button,input{font:inherit;border-radius:13px;padding:13px;border:1px solid #526987}button{background:#dceaff;color:#172237;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #8fa9c8;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #8fa9c8}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;background:#111d30;color:white;margin:7px 0;outline:none}input:focus{border-color:#80eaff;box-shadow:0 0 0 3px #80eaff22}.panel{position:relative;overflow:hidden;width:min(100%,460px);padding:30px;background:linear-gradient(145deg,#202f49,#172237);border:1px solid #526987;border-radius:26px;box-shadow:0 24px 80px #0009;z-index:1}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:#9be8ff}h1{font-size:clamp(44px,12vw,68px);letter-spacing:-3px;line-height:.95;margin:18px 0 8px;text-shadow:0 5px 0 #0a1322}h1 span,header strong span{color:#80eaff}.subtitle{color:#b9c8df;margin:0 0 26px}label{display:block;color:#a9bbd5;font-size:11px;font-weight:900;letter-spacing:1.5px;margin:0 0 5px}.panel>.primary{width:100%;margin:10px 0;background:#83e9ff}.join-row{display:flex;gap:9px;align-items:center}.join-row input{min-width:0;text-transform:uppercase}.join-row button{margin:7px 0;min-width:100px}#status{min-height:22px;color:#ffb6ae;font-size:13px}#roomInfo{border-top:1px solid #526987;margin-top:16px;padding-top:17px}.room-heading{font-size:12px;letter-spacing:2px;color:#b9c8df;display:flex;align-items:center;gap:9px}.room-heading strong{color:#83e9ff;font-size:20px}.copy{padding:6px 10px;font-size:10px;box-shadow:none;margin-left:auto}#players{padding-left:22px;color:#f4f7ff}#players li{padding:3px 0}small{display:block;color:#a9bbd5;margin-top:6px}#waiting{color:#a9bbd5;font-size:13px}.lobby-decoration{position:absolute;right:-20px;bottom:-34px;width:130px;height:100px;opacity:.14;pointer-events:none}.lobby-decoration span{position:absolute;bottom:0;width:40px;height:64px;border:8px solid #80eaff;border-radius:22px 22px 17px 17px}.lobby-decoration span:nth-child(1){left:0;transform:rotate(-12deg)}.lobby-decoration span:nth-child(2){left:40px;height:80px;border-color:#ff7b9c}.lobby-decoration span:nth-child(3){left:80px;transform:rotate(12deg);border-color:#ffd36d}#game{position:relative;width:min(100%,1100px);z-index:1}header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 13px;color:#c3d2e8;font-size:13px;letter-spacing:1px;gap:12px}header strong{font-size:18px;color:#fff}.small-btn{padding:7px 12px;font-size:11px;box-shadow:none}.hud{display:flex;gap:10px;align-items:center;background:#17283c;border:1px solid #405a73;border-radius:12px;padding:9px 13px;margin-bottom:10px}.hud>div{display:flex;flex-direction:column;min-width:52px}.hud small{font-size:9px;letter-spacing:1px;margin:0;color:#8fa9c2}.hud b{font-size:16px}.hud .health{flex:1;min-width:80px}.health-track{height:8px;border-radius:8px;background:#081522;margin-top:6px;overflow:hidden}.health-track i{display:block;height:100%;width:100%;background:#8bff65;border-radius:8px;transition:width .15s}.arena-frame{padding:6px;background:linear-gradient(135deg,#526987,#253b59);border-radius:17px;box-shadow:0 18px 55px #0008}canvas{width:100%;background:#192b3c;border-radius:12px;display:block;touch-action:none}.game-bottom{display:flex;justify-content:space-between;gap:15px;align-items:center}.mobile-controls{display:flex;align-items:center;gap:22px;padding:12px 4px}.control-label{font-size:9px;font-weight:900;letter-spacing:1.3px;color:#9db1c9;text-align:center}#joystick{width:108px;height:108px;margin-top:7px;border-radius:50%;background:#dceaff18;border:2px solid #dceaff55;display:grid;place-items:center;touch-action:none;box-shadow:inset 0 0 20px #0004}#stick{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#c6f6ff,#66cbe9);border:2px solid #fff8;box-shadow:0 4px 12px #0006}.action-controls{display:flex;gap:8px}.action-controls button{height:62px;min-width:104px;padding:5px 12px;background:#ffd36d;box-shadow:0 4px 0 #bb8732}.action-controls button#shoot{background:#83e9ff;box-shadow:0 4px 0 #428ba8}.action-controls b{font-size:18px}.action-controls small{font-size:9px;color:#43566c;margin:0}.scoreboard{background:#17283c;border:1px solid #405a73;border-radius:12px;padding:9px 13px;min-width:150px;font-size:11px}.scoreboard strong{letter-spacing:1px;color:#9be8ff}#scores{margin:5px 0 0;padding-left:20px}#scores li{padding:2px 0;color:#d8e4f3}#feed{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:#c8d9e9;pointer-events:none;text-align:center;text-shadow:0 2px 4px #000;max-width:90vw}#results{position:absolute;inset:65px 0 0;display:grid;place-items:center;background:#081321bb;border-radius:15px;z-index:5}.result-card{width:min(90%,360px);text-align:center;padding:25px;background:linear-gradient(145deg,#263b56,#152337);border:1px solid #6a849d;border-radius:20px;box-shadow:0 15px 50px #0009}.result-card h2{font-size:32px;margin:12px 0}.result-card p{color:#b9c8df}.result-card button{width:100%;margin:7px 0}.result-card .primary{background:#83e9ff}.secondary{background:#dceaff}[hidden]{display:none!important}@media(max-width:650px){body{padding:8px;display:block}.panel{margin:7vh auto 0;padding:24px 20px}#game{margin:0 auto}.hud{gap:7px;padding:8px}.hud>div{min-width:43px}.hud b{font-size:13px}.game-bottom{align-items:flex-start;flex-direction:column;gap:0}.mobile-controls{width:100%;justify-content:space-between;gap:8px;padding:10px 2px}.action-controls{gap:6px}.action-controls button{min-width:88px;padding:4px 7px;font-size:11px}#joystick{width:96px;height:96px}.scoreboard{width:100%;min-width:0}.scoreboard ol{display:flex;gap:18px;flex-wrap:wrap}.scoreboard li{margin-left:4px}}
</style></head><body>
<main id="lobby" class="panel"><div class="eyebrow">⚡ PARTY ARENA • 2–5 JOGADORES</div><h1>CAOS <span>TOTAL</span></h1><p class="subtitle">Entre na arena. Sobreviva ao caos.</p><label for="name">SEU NOME</label><input id="name" maxlength="16" placeholder="Seu apelido" value="Jogador"><button id="create" class="primary">CRIAR SALA</button><div class="join-row"><input id="roomCode" maxlength="4" placeholder="CÓDIGO DA SALA" aria-label="Código da sala"><button id="join">ENTRAR</button></div><p id="status" role="status" aria-live="polite"></p><section id="roomInfo" hidden><div class="room-heading">SALA <strong id="codeLabel"></strong><button id="copyCode" class="copy">COPIAR</button></div><ul id="players"></ul><p id="waiting">Aguardando jogadores...</p><button id="start" class="primary">COMEÇAR PARTIDA</button><small>É necessário ter pelo menos 2 jogadores.</small></section><div class="lobby-decoration"><span></span><span></span><span></span></div></main>
<main id="game" hidden><header><strong>CAOS <span>TOTAL</span></strong><span id="gameCode"></span><button id="leave" class="small-btn">SAIR</button></header><section class="hud"><div><small>RODADA</small><b id="round">01</b></div><div><small>TEMPO</small><b id="timer">02:00</b></div><div><small>STATUS</small><b id="phase">BATALHA</b></div><div class="health"><small>ENERGIA</small><div class="health-track"><i id="healthFill"></i></div></div></section><div class="arena-frame"><canvas id="arena" width="900" height="600" aria-label="Arena de batalha vista de cima"></canvas></div><div class="game-bottom"><div class="mobile-controls"><div class="control-label">MOVIMENTO<div id="joystick"><div id="stick"></div></div></div><div class="action-controls"><button id="boost">IMPULSO <b>⚡</b><small>3,5s</small></button><button id="shoot">DISPARAR <b>✦</b><small>Atacar</small></button></div></div><aside class="scoreboard"><strong>PLACAR</strong><ol id="scores"></ol></aside></div><div id="feed" aria-live="polite"></div><section id="results" hidden><div class="result-card"><div class="eyebrow">FIM DA RODADA</div><h2 id="winner">VITÓRIA!</h2><p id="resultText"></p><button id="again" class="primary">JOGAR NOVAMENTE</button><button id="backLobby" class="secondary">VOLTAR AO LOBBY</button></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="./game.js"></script></body></html>
